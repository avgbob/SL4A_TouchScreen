name: Pin tester issue

on:
  push:
    paths:
      - .github/workflows/pin-tester-issue.yml

permissions:
  contents: read
  issues: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Pin issue 9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"

          ISSUE_ID="$(gh api graphql \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){issue(number:9){id}}}' \
            -F owner="$OWNER" \
            -F name="$NAME" \
            --jq '.data.repository.issue.id')"

          test -n "$ISSUE_ID"

          gh api graphql \
            -f query='mutation($issueId:ID!){pinIssue(input:{issueId:$issueId}){issue{id number url}}}' \
            -F issueId="$ISSUE_ID" \
            --jq '.data.pinIssue.issue'
