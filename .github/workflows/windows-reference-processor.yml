name: Windows reference processor offline tests

on:
  pull_request:
    paths:
      - "userspace/surface-processor/**"
      - "docs/WINDOWS-PROCESSOR-EVIDENCE-MANIFEST-20261018.md"
      - ".github/workflows/windows-reference-processor.yml"
  push:
    branches:
      - "research/windows-contact-processor-v2"
    paths:
      - "userspace/surface-processor/**"
      - "docs/WINDOWS-PROCESSOR-EVIDENCE-MANIFEST-20261018.md"
      - ".github/workflows/windows-reference-processor.yml"

permissions:
  contents: read

jobs:
  offline-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python3 -m compileall -q userspace/surface-processor
      - name: Run strict decoder, V4 oracle, and float32/C-oracle tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m unittest discover
          -s userspace/surface-processor
          -p 'test_*.py'
          -v
