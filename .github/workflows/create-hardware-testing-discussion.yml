name: Create hardware testing discussion

on:
  push:
    paths:
      - .github/workflows/create-hardware-testing-discussion.yml

permissions:
  contents: read
  discussions: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create Hardware Testing discussion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"

          META="$(gh api graphql \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:25){nodes{id name slug}}}}' \
            -F owner="$OWNER" \
            -F name="$NAME")"

          REPO_ID="$(printf '%s' "$META" | jq -r '.data.repository.id')"
          CATEGORY_ID="$(printf '%s' "$META" | jq -r '.data.repository.discussionCategories.nodes[] | select(.name=="Show and tell") | .id' | head -1)"

          if [ -z "$CATEGORY_ID" ] || [ "$CATEGORY_ID" = "null" ]; then
            CATEGORY_ID="$(printf '%s' "$META" | jq -r '.data.repository.discussionCategories.nodes[] | select(.name=="General") | .id' | head -1)"
          fi

          test -n "$REPO_ID"
          test -n "$CATEGORY_ID"

          BODY="$(cat docs/HARDWARE-TESTING-HUB.md)"

          gh api graphql \
            -f query='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{id number url}}}' \
            -F repositoryId="$REPO_ID" \
            -F categoryId="$CATEGORY_ID" \
            -F title="Hardware Testing Hub — Surface Laptop 4 AMD / MSHW0231" \
            -F body="$BODY" \
            --jq '.data.createDiscussion.discussion'
