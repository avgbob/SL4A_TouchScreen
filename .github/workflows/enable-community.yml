name: Enable Issues and Discussions

on:
  push:
    paths:
      - .github/workflows/enable-community.yml

permissions:
  contents: write
  issues: write
  discussions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Issues and Discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY" \
            -f has_issues=true \
            -f has_discussions=true
