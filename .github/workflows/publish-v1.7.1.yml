name: Publish v1.7.1 release

on:
  push:
    paths:
      - .github/workflows/publish-v1.7.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish v1.7.1 and update v1.7.0 notice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create v1.7.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target eccedfb606e579242950052de2022d445dee028c \
            --title "SL4A_TouchScreen v1.7.1 — Secure Boot Activation Recovery" \
            --notes-file docs/releases/v1.7.1.md \
            --latest

          gh release edit v1.7.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "SL4A_TouchScreen v1.7.0 — Gate5 Production Activation" \
            --notes-file docs/releases/v1.7.0.md
